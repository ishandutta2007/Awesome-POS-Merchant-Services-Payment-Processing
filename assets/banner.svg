<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340" style="background: transparent;">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.25" />
      <circle cx="40" cy="40" r="1" fill="#475569" fill-opacity="0.4" />
    </pattern>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(0.5deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(8px) rotate(-0.5deg); }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -40; }
      }
      @keyframes pulseLight {
        0%, 100% { opacity: 0.3; transform: scale(0.98); }
        50% { opacity: 0.7; transform: scale(1.02); }
      }
      @keyframes radarSweep {
        0% { stroke-dashoffset: 0; opacity: 0.8; }
        50% { opacity: 0.3; }
        100% { stroke-dashoffset: 120; opacity: 0.8; }
      }
      .floating-card-1 {
        animation: floatSlow 6s ease-in-out infinite;
        transform-origin: center;
      }
      .floating-card-2 {
        animation: floatReverse 7s ease-in-out infinite;
        transform-origin: center;
      }
      .flowing-stream {
        stroke-dasharray: 8, 8;
        animation: dashAnim 2.5s linear infinite;
      }
      .pulse-glow {
        animation: pulseLight 4s ease-in-out infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="1200" height="340" rx="20" fill="url(#bg-grad)" />
  <rect width="1200" height="340" rx="20" fill="url(#grid)" />

  <!-- Subtle Glowing Orbs in Background -->
  <circle cx="200" cy="170" r="160" fill="#38bdf8" opacity="0.08" filter="blur(40px)" class="pulse-glow" />
  <circle cx="1020" cy="170" r="180" fill="#818cf8" opacity="0.1" filter="blur(50px)" class="pulse-glow" />

  <!-- DYNAMIC ANIMATED BACKGROUND ELEMENTS (Positioned to sides so center title stays 100% crisp & clear) -->
  
  <!-- Left Side: POS Terminal Flow Graph (Back/Side Layer) -->
  <g class="floating-card-1" opacity="0.85">
    <!-- Payment Stream Line -->
    <path d="M 60 170 C 110 120, 160 220, 210 170" fill="none" stroke="url(#primary-glow)" stroke-width="2.5" class="flowing-stream" />
    
    <!-- Mini Terminal Node -->
    <rect x="50" y="80" width="130" height="74" rx="10" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.5))" />
    <circle cx="70" cy="100" r="5" fill="#10b981" />
    <text x="84" y="104" fill="#94a3b8" font-size="11" font-family="monospace">POS Terminal</text>
    <rect x="70" y="118" width="90" height="6" rx="3" fill="#334155" />
    <rect x="70" y="130" width="55" height="6" rx="3" fill="#38bdf8" opacity="0.8" />
    
    <!-- Mini Gateway Node -->
    <rect x="70" y="210" width="130" height="65" rx="10" fill="url(#card-grad)" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.6" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.5))" />
    <circle cx="90" cy="230" r="5" fill="#38bdf8" />
    <text x="104" y="234" fill="#94a3b8" font-size="11" font-family="monospace">Payment Switch</text>
    <text x="90" y="256" fill="#10b981" font-size="12" font-family="monospace" font-weight="bold">✓ 99.999% SLA</text>
  </g>

  <!-- Right Side: Real-time Transaction / Orchestration Card (Back/Side Layer) -->
  <g class="floating-card-2" opacity="0.85">
    <path d="M 990 170 C 1040 120, 1090 220, 1140 170" fill="none" stroke="url(#pulse-grad)" stroke-width="2.5" class="flowing-stream" />
    
    <!-- Mini Transaction Card -->
    <rect x="1010" y="75" width="140" height="78" rx="10" fill="url(#card-grad)" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.6" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.5))" />
    <text x="1025" y="100" fill="#c084fc" font-size="11" font-family="monospace" font-weight="bold">TXN #849204</text>
    <text x="1025" y="122" fill="#f8fafc" font-size="15" font-family="monospace" font-weight="bold">$128.50 USD</text>
    <text x="1025" y="140" fill="#10b981" font-size="10" font-family="monospace">● AUTHORIZED (42ms)</text>

    <!-- Mini Routing Card -->
    <rect x="990" y="205" width="145" height="70" rx="10" fill="url(#card-grad)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.5))" />
    <circle cx="1010" cy="225" r="5" fill="#10b981" />
    <text x="1024" y="229" fill="#94a3b8" font-size="11" font-family="monospace">Smart Routing</text>
    <rect x="1010" y="243" width="105" height="6" rx="3" fill="#334155" />
    <rect x="1010" y="255" width="70" height="6" rx="3" fill="#10b981" opacity="0.8" />
  </g>

  <!-- FOREGROUND: TITLE, BADGES, SUBTITLE (Guaranteed High Contrast and Unobstructed) -->
  <g transform="translate(600, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 48)">
      <rect x="-175" y="0" width="350" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
      <circle cx="-150" cy="16" r="5" fill="#38bdf8" />
      <text x="0" y="21" fill="#38bdf8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle" letter-spacing="1.5">
        FINTECH &amp; MERCHANT ARCHITECTURE
      </text>
    </g>

    <!-- Main Title (Gradient Fill + Drop Shadow) -->
    <text x="0" y="132" text-anchor="middle" fill="url(#primary-glow)" class="title-text" font-size="44" filter="drop-shadow(0 3px 18px rgba(56, 189, 248, 0.45))">
      POS &amp; Merchant Services
    </text>

    <!-- Subtitle Line 1 -->
    <text x="0" y="176" text-anchor="middle" fill="#ffffff" class="title-text" font-size="25" opacity="0.95" letter-spacing="0.2">
      Payment Processing Ecosystem
    </text>

    <!-- Subtitle Description -->
    <text x="0" y="218" text-anchor="middle" fill="#94a3b8" class="sub-text" font-size="14.5" opacity="0.9">
      Curated Landscape of Commercial SaaS Giants &amp; Self-Hosted Open-Source Billing Engines
    </text>

    <!-- Ecosystem Feature Pills -->
    <g transform="translate(0, 260)">
      <!-- Pill 1 -->
      <g transform="translate(-230, 0)">
        <rect x="-65" y="0" width="130" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="0" y="18" fill="#e2e8f0" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="500" text-anchor="middle">💳 Point of Sale</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-75, 0)">
        <rect x="-75" y="0" width="150" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="0" y="18" fill="#e2e8f0" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="500" text-anchor="middle">⚡ Smart Routing</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(85, 0)">
        <rect x="-70" y="0" width="140" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="0" y="18" fill="#e2e8f0" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="500" text-anchor="middle">🛡️ PCI-DSS &amp; EMV</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(235, 0)">
        <rect x="-65" y="0" width="130" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="0" y="18" fill="#e2e8f0" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="500" text-anchor="middle">🌐 Self-Hosted</text>
      </g>
    </g>
  </g>

  <!-- Border Highlight -->
  <rect width="1200" height="340" rx="20" fill="none" stroke="url(#primary-glow)" stroke-width="1.5" stroke-opacity="0.3" />
</svg>
